site_name: xiaozhenxu
site_author: xiaozhenxu
site_url: https://xiaozhenxu.github.io/blog
repo_url: https://github.com/xiaozhenxu/blog/
repo_name: Blog GitHub

# 导航与本地目录对应：推理优化、核心算子、计算基础。
nav:
  - 首页: index.md
  - 推理优化:
      - 模型推理优化：以 pi05 为例: inference/system-optimization/system-optimization.md
  - 核心算子:
      - Flash Attention: operators/flash-attention/flash-attention.md
      - CuTe GEMM: operators/cute-gemm/cute-gemm.md
  - 计算基础:
      - Tensor Cores: fundamentals/tensor-cores/tensor-cores.md
      - 数据搬运：LDG、cp.async 与 TMA: fundamentals/gpu-data-transfer/gpu-data-transfer.md

theme:
  name: material
  custom_dir: overrides
  font: false
  icon:
    logo: material/code-tags
  language: zh  # 设置为中文界面
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - content.code.copy
    - navigation.sections
    - navigation.footer
    - toc.follow
    - navigation.tabs
    - navigation.top  # 返回顶部按钮
    - search.highlight  # 搜索高亮

# 启用插件
plugins:
  - search  # 搜索插件
  # 你可以根据需要逐步添加其他插件，例如：
  # - blog:  # 博客插件，实现文章列表和分类
  # - minify:  # 压缩HTML代码

# Markdown扩展
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition  # 支持提示框（如“注意”、“警告”）
  - pymdownx.superfences  # 更好的代码块
  - pymdownx.tasklist  # 任务列表
  - pymdownx.arithmatex
  - toc:  # 自动生成目录
      permalink: true

extra:
  homepage: /blog/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xiaozhenxu/
      name: GitHub

# math 渲染所需的 JS（使用 MathJax）
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML

extra_css:
  - assets/stylesheets/custom.css

copyright: xiaozhenxu · 技术笔记
